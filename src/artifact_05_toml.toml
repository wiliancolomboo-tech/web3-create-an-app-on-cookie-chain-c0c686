[package]
name = "cookie_jar"
version = "0.1.0"
description = "Autonomous Agent Mindshare & Staking Protocol for Cookie Chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cookie_jar"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }