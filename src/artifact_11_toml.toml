[package]
name = "cookie_pulse"
version = "0.1.0"
description = "Autonomous AI Agent Mindshare Staking Protocol on Cookie Chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cookie_pulse"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }