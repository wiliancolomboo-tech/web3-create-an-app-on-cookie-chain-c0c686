[package]
name = "cookie-chain-app"
version = "0.1.0"
description = "CookieAgentFi Protocol on Cookie Chain SVM"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cookie_chain_app"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.26"